apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-fabric
  namespace: argocd

spec:
  project: default

  source:
    repoURL: ghcr.io/nginx/charts
    chart: nginx-gateway-fabric
    targetRevision: 2.6.7

    helm:
      releaseName: ngf

      valuesObject:
        nginx:
          service:
            type: NodePort
            externalTrafficPolicy: Cluster
            nodePorts:
              - port: 30080
                listenerPort: 80

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true