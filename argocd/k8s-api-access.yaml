apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-api-access
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/victorc9782/teleport-k8s.git
    targetRevision: main
    path: infrastructure/k8s-api-access

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
