apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-routing
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/victorc9782/teleport-k8s.git
    targetRevision: main
    path: networking/nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true