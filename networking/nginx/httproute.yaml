apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: nginx-demo
  namespace: default

spec:
  parentRefs:
    - name: nginx-gateway

  hostnames:
    - nginx-demo.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: nginx-demo
          port: 80