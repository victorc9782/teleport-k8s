apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: victor-root-ca
  namespace: cert-manager

  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  isCA: true

  commonName: Victor Root CA

  secretName: victor-root-ca

  duration: 87600h   # 10 years

  privateKey:
    algorithm: ECDSA
    size: 256

  issuerRef:
    name: victor-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io